<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
    <linearGradient id="white-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4f1f9" />
    </linearGradient>
  </defs>

  <!-- Background Squircle / Dark Canvas -->
  <rect width="64" height="64" rx="14" fill="#080c14" />
  <rect width="64" height="64" rx="14" stroke="#00f0ff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Glowing Aura Group -->
  <g filter="url(#neon-glow)">
    <!-- Terminal Chevron > -->
    <path
      d="M17 18 L31 32 L17 46"
      stroke="url(#white-glow)"
      stroke-width="6.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Forward Slash / -->
    <path
      d="M37 46 L47 18"
      stroke="url(#cyan-glow)"
      stroke-width="6.5"
      stroke-linecap="round"
    />
  </g>

  <!-- Crisp Core Overlay -->
  <path
    d="M17 18 L31 32 L17 46"
    stroke="#ffffff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M37 46 L47 18"
    stroke="#00f0ff"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
