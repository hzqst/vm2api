# Guest OS layers change independently of application releases.
name: guest-images

on:
  push:
    branches: [main]
    paths:
      - 'docker/kin-os/**'
      - '.github/workflows/guest-images.yml'
  workflow_dispatch:

concurrency:
  group: guest-images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  guest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: ubuntu-24.04
            image: ubuntu:24.04
          - directory: debian-12
            image: debian:12
          - directory: archlinux
            image: arch:latest
          - directory: fedora-41
            image: fedora:41
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: resolve image tag
        id: meta
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "tag=ghcr.io/${REPOSITORY_OWNER,,}/kin-os-${IMAGE}" >> "$GITHUB_OUTPUT"
      - name: build and push guest image
        uses: docker/build-push-action@v7
        with:
          context: docker/kin-os/${{ matrix.directory }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=kin-os-${{ matrix.directory }}
          cache-to: type=gha,scope=kin-os-${{ matrix.directory }},mode=max
