name: 功能建议
description: 新功能、改进现有行为或文档
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        问题与故障请用 **Bug 报告**。建议请先说明场景，再给方案。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自查
      options:
        - label: 已搜索现有 Issues 与 CHANGELOG.md，没有重复
          required: true

  - type: input
    id: version
    attributes:
      label: 当前使用的版本
      placeholder: "1.3.102"
    validations:
      required: true

  - type: textarea
    id: scenario
    attributes:
      label: 使用场景 / 痛点
      description: 你在做什么、现在卡在哪里
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为、配置项或接口形态
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 现有替代做法
      description: 目前如何绕过，以及为什么不够
    validations:
      required: false
