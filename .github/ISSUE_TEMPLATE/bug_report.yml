name: Bug 报告
description: 部署、VM 创建、请求失败等问题。提交前请先阅读 ISSUE_GUIDE.md
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先阅读 [Issue 提交指南](https://github.com/dofastted/vm2api/blob/main/ISSUE_GUIDE.md)，里面有版本、环境、日志的收集命令。

        > ⚠️ Issue 公开可见。API Key、OAuth / setup-token、sessionKey、Cookie、代理账号密码、公网 IP **全部打码**；不要上传 `.env`、`vms/*.json`、数据库。

  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前自查
      options:
        - label: 已升级到最新 Release，问题仍存在（或无法升级，已在下方说明原因）
          required: true
        - label: 已搜索现有 Issues，没有重复
          required: true
        - label: 已阅读 ISSUE_GUIDE.md，并对贴出的所有内容做了脱敏
          required: true

  - type: dropdown
    id: category
    attributes:
      label: 问题类型
      options:
        - 安装 / 升级 / 部署
        - VM 创建 / 启动 / 重置
        - 账号导入 / OAuth / 凭证
        - 请求失败（4xx / 5xx）
        - 流式中断 / incomplete_response
        - 额度 / 429 / 冷却 / 调度
        - 代理 / 出口 / DoH
        - 集群节点 / 远程 VPS
        - 管理台界面
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 1. 使用的版本
      description: "`cat /opt/vm2api/VERSION`；升级后出现的问题写“旧版本 → 新版本”"
      placeholder: "1.3.102（从 1.3.100 升级后出现）"
    validations:
      required: true

  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 一键脚本 install.sh（预构建镜像）
        - 手动 Docker Compose
        - install.sh --from-source 源码构建
        - systemd 本机运行
        - 其他
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 一两句话说明现象
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 2. 可复现路线
      description: 照做就能复现的最小步骤。请求类问题附最小 curl（密钥替换为 $VM2API_API_KEY）。
      placeholder: |
        前置：2 个 VM，Claude Max OAuth，Docker 槽位，每 VM 独立 SOCKS5
        1. 管理台 → 虚拟机 → 新建 …
        2. curl -sS -D - http://127.0.0.1:8787/v1/messages -H "Authorization: Bearer $VM2API_API_KEY" …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: 期望结果 / 实际结果
      description: 实际结果写 HTTP 状态码、错误 code、界面提示原文
      placeholder: |
        期望：返回 200 并收到 message_stop
        实际：502 incomplete_response，x-request-id = …
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: 复现频率
      options:
        - 必现
        - 偶发（填写大致比例）
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: host_env
    attributes:
      label: 3. 运行环境（VPS / 宿主机）
      description: 可直接粘贴 ISSUE_GUIDE.md §3.1 一键收集命令的输出
      value: |
        - 云厂商 / 地区：
        - 规格（CPU / 内存 / 磁盘）：
        - 系统与内核：
        - 虚拟化（KVM 母机 / OpenVZ / LXC / 物理机），/dev/kvm 是否存在：
        - Docker 版本：
        - 槽位运行时（Docker 容器 / KVM-QEMU）：
        - VM 数量 / 是否多 VPS 集群：
    validations:
      required: true

  - type: textarea
    id: proxy_env
    attributes:
      label: 代理 / 出口
      description: 只写国家或州，不写完整 IP 与账号密码
      value: |
        - 出口方式（独立 SOCKS5 / 本机直连 local / 其他）：
        - 代理类型（住宅 / ISP 静态 / 机房；动态或静态）：
        - 出口地区：
        - 是否多个 VM 或其他程序共用同一出口：
        - 是否配置自定义 DoH：
        - 宿主机是否设置 HTTP(S)_PROXY / 透明代理：
    validations:
      required: true

  - type: textarea
    id: account_client
    attributes:
      label: 账号与客户端
      value: |
        - 账号类型（Claude Pro / Max / Team / Enterprise、ChatGPT Codex）：
        - 凭证方式（OAuth / setup-token / sessionKey / API Key）：
        - 客户端与入口（Claude Code、Cursor…；/v1/messages、/v1/chat/completions、/v1/responses）：
    validations:
      required: false

  - type: textarea
    id: vm_logs
    attributes:
      label: 4.1 VM 创建 / 槽位日志
      description: |
        管理台报错原文或接口响应体；`docker logs --since 30m --timestamps vm2api 2>&1 | tail -n 300`；
        `docker logs --since 30m --timestamps kin-01 2>&1 | tail -n 300`（vm-01 → kin-01）。日志较长请上传附件。
      render: shell
    validations:
      required: false

  - type: textarea
    id: request_logs
    attributes:
      label: 4.2 请求日志
      description: |
        响应头 `x-request-id`，以及管理台 → 日志 中该请求的 attempts
        （或 `GET /api/panel/request-logs/<request_id>/attempts`）。debug body 含提示词，贴出前自查。
      render: text
    validations:
      required: false

  - type: textarea
    id: source
    attributes:
      label: 5. 源码定位（可选）
      description: 可疑代码的 permalink（文件页按 y 获取带 commit 的链接）、你的分析或已验证的最小修改
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: 已尝试的操作 / 补充
      description: 重启、重建槽位、换代理、回退版本等尝试及其结果；截图也可放这里
    validations:
      required: false
